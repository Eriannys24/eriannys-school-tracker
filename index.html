    <style>
         body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: var(--bg-color); /* Usando sua variável do style.css */
        }
        .menu-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
       
        /* Estilização da Logo */
        .logo-colegio {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 { margin-bottom: 30px; color: white; font-size: 2rem; }
       
        /* --- ESTILOS DO FORMULÁRIO DE LOGIN --- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            color: var(--text-main);
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .input-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .btn-submit {
            padding: 12px;
            background: #10b981; /* Verde profissional para o botão de entrar */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #059669;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        /* --- MENU PRINCIPAL (INICIALMENTE ESCONDIDO) --- */
        .btn-group {
            display: none; /* Escondido até o login estar correto */
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-scanner { background: #3b82f6; }
        .btn-telao { background: #8b5cf6; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
       
        p { margin-top: 25px; font-size: 0.9rem; opacity: 0.7; color: var(--text-main); }
    </style>
